<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIC TAC TOE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="screen-start" class="screen active">
    <div class="start-content">
      <h1 class="game-title">
        <span class="title-tic">TIC</span><span class="title-mid"> TAC </span><span class="title-toe">TOE</span>
      </h1>
      <p class="subtitle">BEST OF 5</p>
      <input
        type="text"
        id="player-name"
        class="name-input"
        placeholder="ENTER YOUR NAME"
        maxlength="20"
        autocomplete="off"
        spellcheck="false"
      />
      <div class="diff-group">
        <button class="diff-btn" data-diff="EASY">EASY</button>
        <button class="diff-btn active" data-diff="MEDIUM">MEDIUM</button>
        <button class="diff-btn" data-diff="HARD">HARD</button>
      </div>
      <button id="btn-init" class="btn-init">INITIALIZE</button>
    </div>
  </div>

  <!-- Game screen -->
  <div id="screen-game" class="screen">
    <div class="game-layout">
      <div class="scoreboard">
        <div class="score-side">
          <div class="score-label" id="score-player-name">PLAYER</div>
          <div class="score-num score-x" id="score-x">0</div>
        </div>
        <div class="score-center">
          <div class="round-label" id="round-label">ROUND 1 OF 5</div>
        </div>
        <div class="score-side">
          <div class="score-label">AI</div>
          <div class="score-num score-o" id="score-o">0</div>
        </div>
      </div>

      <div class="turn-indicator" id="turn-indicator">YOUR TURN</div>

      <div class="board-wrap">
        <div class="board" id="board">
          <div class="cell" data-index="0"></div>
          <div class="cell" data-index="1"></div>
          <div class="cell" data-index="2"></div>
          <div class="cell" data-index="3"></div>
          <div class="cell" data-index="4"></div>
          <div class="cell" data-index="5"></div>
          <div class="cell" data-index="6"></div>
          <div class="cell" data-index="7"></div>
          <div class="cell" data-index="8"></div>
        </div>
        <div class="round-overlay hidden" id="round-overlay">
          <div class="round-result-text" id="round-result-text"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Game over screen -->
  <div id="screen-gameover" class="screen">
    <div class="gameover-content">
      <div class="gameover-title" id="gameover-title">VICTORY</div>
      <div class="gameover-subtitle" id="gameover-subtitle"></div>
      <div class="gameover-score" id="gameover-score">0 — 0</div>
      <button id="btn-play-again" class="btn-play-again">PLAY AGAIN</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
