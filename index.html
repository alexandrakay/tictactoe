<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIC TAC TOE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="screen-start" class="screen active">
    <div class="start-content">
      <h1 class="game-title">
        <span class="title-tic">TIC</span><span class="title-mid"> TAC </span><span class="title-toe">TOE</span>
      </h1>
      <p class="subtitle">BEST OF 5</p>
      <input
        type="text"
        id="player-name"
        class="name-input"
        placeholder="ENTER YOUR NAME"
        maxlength="20"
        autocomplete="off"
        spellcheck="false"
      />
      <div class="diff-group">
        <button class="diff-btn" data-diff="EASY">EASY</button>
        <button class="diff-btn active" data-diff="MEDIUM">MEDIUM</button>
        <button class="diff-btn" data-diff="HARD">HARD</button>
      </div>
      <button id="btn-init" class="btn-init">INITIALIZE</button>
    </div>
  </div>

  <div id="screen-game" class="screen">
    <div class="game-content"><!-- filled by JS --></div>
  </div>

  <div id="screen-gameover" class="screen">
    <div class="gameover-content"><!-- filled by JS --></div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
